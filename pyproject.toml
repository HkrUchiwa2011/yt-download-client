[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yt-download-client"
version = "1.0.1"
description = "Python client for yt-download-api — download YouTube videos via HTTP from any script or bot."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["httpx>=0.27.0"]
keywords = ["youtube", "download", "api", "client", "yt-dlp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Homepage = "https://github.com/HkrUchiwa2011/yt-download-api"
Repository = "https://github.com/HkrUchiwa2011/yt-download-api"
Issues = "https://github.com/HkrUchiwa2011/yt-download-api/issues"

[project.optional-dependencies]
dev = ["pytest", "pytest-httpx", "hatch"]
